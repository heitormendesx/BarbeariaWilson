<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <main>
        <div class="container-fluid">
        <h1>Currículo</h1>

        <section id="currículo">
            <h2>Deixe seu currículo aqui!</h2>
            <p>Preencha os campos e envie para nós</p>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="Mulher">
            <label class="form-check-label" for="Mulher">
            Mulher
            </label>
        </div>
        <div class="form-check">
         <input class="form-check-input" type="checkbox" value="" id="Homem" >
         <label class="form-check-label" for="Homem">
            Homem
         </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="Outro" >
            <label class="form-check-label" for="Outro">
                Outro
            </label>
                
        </div>
            <form>
                <div class=campo-curriculo>
                    <label for="nome">Seu nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                </div>

                <div class="campo-curriculo">
                    <label for="emal">Seu email</label> 
                    <input type="email" id="email" placeholder="exemplo@gmail.com">
                </div>

                <div class="campo-curriculo">
                    <label for="Objetivos">Seus objetivos</label>
                    <input type="objetivos" id="Objetivos" placeholder="Digite seus objetivos:">
                </div>

                <div class="campo-curriculo>"
                    <label for="Prós e contras">Seus prós e contras</label>
                    <input type="prós e contras" id="Prós e contras"placeholder=Prós/contras>
                </div>

                <div class="campo-curriculo">
                    <label for="Qual animal você seria">Qual animal você seria</label>
                    <select id="Qual animal você seria" name="Qual animal você seria">
                        <option value="">Selecione uma opção</option>
                        <option value="Cobra">Cobra</option>
                        <option value="Aguia">Aguia</option>
                        <option value="Leão">Leão</option>
                        <option value="Coelho">Coelho</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <button type="Enviar">Enviar</button>
                
                   </div>                         
                 
            </form>
        </section>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
