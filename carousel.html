<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="carousel-vendas" class="carousel slide">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carousel-vendas" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carousel-vendas" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carousel-vendas" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="./assets/img/image.png" class="d-block w-100" alt="Gel">
      <div class="carousel-caption d-none d-md-block">
        <h5>Gel capilar R$37,99</h5>
        <p>Gel fixador capilar com efeito </p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="./assets/img/image copy.png" class="d-block w-100" alt="Pomada capilar">
      <div class="carousel-caption d-none d-md-block">
        <h5>Pomada capilar por apenas R$58,67</h5>
        <p>Pomada Modeladora para fixação do cabelo</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="./assets/img/image copy 2.png" class="d-block w-100" alt="Shampo capilar do Cristiano Ronaldo">
      <div class="carousel-caption d-none d-md-block">
        <h5>Shampoo R$95,99</h5>
        <p>Melhor Shampoo do mercado barato apenas no nosso site</p>
      </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carousel-vendas" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carousel-vendas" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Próximo</span>
  </button>
</div>
</body>
</html>
